(function importReeseRoster(){
  const norm=n=>String(n||'').toLowerCase().replace(/[^a-z]/g,'');
  db.people=(db.people||[]).filter(p=>!['addafamilymember','darrellreese','jeanetterees e'.replace(/ /g,'')].includes(norm(p.name)));
  for(const entry of reeseRoster){
    const found=db.people.find(p=>norm(p.name)===norm(entry.name));
    if(found) Object.assign(found,entry,{birthday:entry.birthday||found.birthday||''});
    else db.people.push({id:id(),...entry,bio:'',phone:'',address:'',private:true,photo:''});
  }
  save();
})();
function birthdayItemsForDate(date){
 const mmdd=String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
 const birthdays=db.people.filter(p=>p.birthday&&p.birthday.slice(5)===mmdd).map(p=>({id:'birthday-'+p.id,personId:p.id,title:p.name+'’s birthday',date:date.getFullYear()+'-'+mmdd,time:'All day',type:'Birthday',description:'Family birthday',rsvp:false,signup:false}));
 if(mmdd==='07-11')birthdays.push({id:'reese-anniversary-'+date.getFullYear(),title:'Darrell & Ruth’s anniversary',date:date.getFullYear()+'-07-11',time:'All day',type:'Anniversary',description:'Married July 11, 1952',rsvp:false,signup:false});
 return birthdays;
}
function calendarEventMarkup(e,ds){
 const action=e.personId?'personDetail('+e.personId+')':'eventDiscussion('+e.id+')';
 const colors={
  'Family event':{bg:'#dce8df',fg:'#315b42',border:'#72977d'},
  'Holiday':{bg:'#f4e1df',fg:'#873f3a',border:'#c47b72'},
  'Birthday':{bg:'#f3e8c9',fg:'#76551d',border:'#c5a45c'},
  'Announcement':{bg:'#dce8f2',fg:'#315b70',border:'#739bb4'},
  'Milestone':{bg:'#e9e0f2',fg:'#65477e',border:'#a48abd'},
  'Anniversary':{bg:'#f2dfeb',fg:'#7b4567',border:'#bb83a5'}
 };
 const type=e.personId?'Birthday':(e.type||'Family event');
 const c=colors[type]||{bg:'#e8e8e5',fg:'#50534e',border:'#999d95'};
 const style=`background:${c.bg};color:${c.fg};border-left:3px solid ${c.border};`;
 return `<div class="cal-event" title="${esc(e.title)} · ${esc(type)}" onclick="event.stopPropagation();${action}" style="${style}">${esc(e.title)}</div>`;
}
function upcomingBirthdayItems(){
 const today=new Date();today.setHours(0,0,0,0);
 const upcoming=db.people.filter(p=>p.birthday).map(p=>{
  const parts=p.birthday.slice(5).split('-').map(Number);let d=new Date(today.getFullYear(),parts[0]-1,parts[1]);
  if(d<today)d=new Date(today.getFullYear()+1,parts[0]-1,parts[1]);
  return {id:'birthday-'+p.id,personId:p.id,title:p.name+'’s birthday',date:d.getFullYear()+'-'+String(parts[0]).padStart(2,'0')+'-'+String(parts[1]).padStart(2,'0'),time:'All day',type:'Birthday',description:'Family birthday',rsvp:false,signup:false};
 });
 const anniversaryYear=(new Date(today.getFullYear(),6,11)<today)?today.getFullYear()+1:today.getFullYear();
 upcoming.push({id:'reese-anniversary-'+anniversaryYear,title:'Darrell & Ruth’s anniversary',date:anniversaryYear+'-07-11',time:'All day',type:'Anniversary',description:'Married July 11, 1952',rsvp:false,signup:false});
 return upcoming.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,12);
}
function editPersonBirthday(pid){
 const p=db.people.find(x=>x.id===pid);if(!p)return;
 const current=p.birthday?p.birthday.slice(5,7)+'-'+p.birthday.slice(8,10)+'-'+p.birthday.slice(0,4):'';
 const value=prompt('Update birthday for '+p.name+' (MM-DD-YYYY):',current);if(value===null)return;
 const m=value.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(!m){alert('Please use MM-DD-YYYY.');return;}
 const mm=Number(m[1]),dd=Number(m[2]),yyyy=Number(m[3]),test=new Date(yyyy,mm-1,dd);
 if(test.getMonth()!==mm-1||test.getDate()!==dd){alert('Please enter a valid date.');return;}
 p.birthday='2000-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');save();personDetail(pid);
}

head"><div class="month-title" id="monthTitle"></div><div class="toolbar"><button class="btn small" onclick="shiftMonth(-1)">‹</button><button class="btn small" onclick="shiftMonth(1)">›</button></div></div><div class="calendar-legend"><span><i style="--legend:#72977d"></i>Family</span><span><i style="--legend:#c47b72"></i>Holiday</span><span><i style="--legend:#c5a45c"></i>Birthday</span><span><i style="--legend:#739bb4"></i>Announcement</span><span><i style="--legend:#a48abd"></i>Milestone</span><span><i style="--legend:#bb83a5"></i>Anniversary</span></div><div class="cal-grid" id="calendarGrid"></div></div><div class="card"><div class="section-title"><div><h3>Coming up</h3><div class="hint">Save the date.</div></div>${btn('All events','goCalendar()','small')}</div>${upcoming.length?upcoming.map(e=>eventRow(e)).join(''):'<div class="empty">No events yet. Add the next family get-together.</div>'}</div></div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title"><div><h3>Family conversation</h3><div class="hint">A note from the family thread.</div></div>${btn('Join discussion','go(\'discussion\')','small')}</div>${db.posts.slice(-2).reverse().map(p=>`<div class="post"><div class="post-meta"><b>${esc(p.author)}</b><span>${esc(p.date)}</span></div><p>${esc(p.text)}</p></div>`).join('')||'<div class="empty">Start the conversation.</div>'}</div><div class="card"><div class="section-title"><div><h3>From the archives</h3><div class="hint">Stories that brought us here.</div></div>${btn('Explore','go(\'archives\')','small')}</div><p style="font:700 18px 'Playfair Display';margin:12px 0 6px">A Trip to the Farm</p><div class="hint">Family audio · Darrel & Jeanette Reese</div><p style="font-size:12px;color:var(--muted);line-height:1.6">The family archive preserves the voices, photographs, and stories of generations of Reeses.</p></div></div>`}
function eventRow(e){let r=(db.rsvps[e.id]||[]).length,s=(db.signups[e.id]||[]).length;return `<div class="event-row"><div class="date-tile"><span>${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</span><b>${new Date(e.date+'T12:00:00').getDate()}</b></div><div class="event-info"><b>${esc(e.title)}</b><p>${esc(e.time||'Time TBD')} · ${esc(e.description||e.type)}</p><span class="tag">${esc(e.type||'Family event')}</span><div class="toolbar" style="margin-top:8px"><button class="btn small" onclick="eventDiscussion(${e.id})">Discussion · ${(e.comments||[]).length}</button>${e.rsvp?`<button class="btn small" onclick="rsvpEvent(${e.id})">RSVP · ${r} attending</button>`:''}${e.signup?`<button class="btn small" onclick="signupEvent(${e.id})">Bring something · ${s} signed up</button>`:''}<button class="btn small" onclick="deleteEvent(${e.id})">Delete event</button></div></div></div>`}
function goCalendar(){go('home');document.querySelector('.calendar-head')?.scrollIntoView({behavior:'smooth'})}
function shiftMonth(n){calDate.setMonth(calDate.getMonth()+n);drawCalendar()}
function drawCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth();$('#monthTitle').textContent=calDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=new Date();let out=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,events=[...db.events.filter(e=>e.date===ds),...birthdayItemsForDate(d)];out+=`<div class="cal-cell ${d.getMonth()!==m?'other':''} ${d.toDateString()===today.toDateString()?'today':''}" onclick="eventModal('${ds}')"><div class="daynum">${d.getDate()}</div>${events.slice(0,2).map(e=>calendarEventMarkup(e,ds)).join('')}${events.length>2?`<small>+${events.length-2} more</small>`:''}</div>`}$('#calendarGrid').innerHTML=out}
function eventModal(date=''){openModal('Create a family event',`<form onsubmit="saveEvent(event)">${field('Event name','title')}${field('Date','date','date',date)}${field('Time','time','time','12:00')}<div class="field"><label>Event type</label><select name="type"><option>Family event</option><option>Holiday</option><option>Birthday</option><option>Announcement</option><option>Milestone</option></select></div><div class="field"><label>Details</label><textarea name="description" placeholder="Share the details with the family..."></textarea></div><div class="field"><label>Announcement / event picture (optional)</label><input type="file" name="eventPhoto" accept="image/*"></div><label><input type="checkbox" name="rsvp" checked> Accept RSVPs / head count</label><br><label><input type="checkbox" name="signup"> Add a bring-something sign-up sheet</label><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save event</button></div></form>`)}
function saveEvent(ev){ev.preventDefault();let f=document.querySelector('[name=eventPhoto]').files[0],item={id:id(),title:val('title'),date:val('date'),time:val('time'),type:val('type'),description:val('description'),rsvp:checked('rsvp'),signup:checked('signup'),photo:''};let finish=()=>{db.events.push(item);save();closeModal();render()};if(f){let r=new FileReader();r.onload=()=>{item.photo=r.result;finish()};r.readAsDataURL(f)}else finish()}
function deleteEvent(eid){const item=db.events.find(e=>e.id===eid);if(!item)return;if(!confirm('Delete “'+item.title+'” from the family calendar? This cannot be undone.'))return;db.events=db.events.filter(e=>e.id!==eid);delete db.rsvps[eid];delete db.signups[eid];save();render()}
function rsvpEvent(eid){let who=prompt('Your name for the RSVP?');if(!who)return;db.rsvps[eid]=db.rsvps[eid]||[];db.rsvps[eid].push(who);save();render()}function signupEvent(eid){let who=prompt('Your name?');if(!who)return;let what=prompt('What will you bring?');if(!what)return;db.signups[eid]=db.signups[eid]||[];db.signups[eid].push({who,what});save();render();}
function eventDiscussion(eid){const e=db.events.find(x=>String(x.id)===String(eid));if(!e)return;const comments=e.comments||[];openModal('Event discussion',`<div class="event-discussion-head"><span class="tag">${esc(e.type||'Family event')}</span><h3>${esc(e.title)}</h3><p>${esc(e.date)} · ${esc(e.time||'Time TBD')}</p>${e.description?`<p>${esc(e.description)}</p>`:''}</div><div class="event-comments">${comments.map((c,i)=>`<div class="event-comment"><div class="comment-avatar">${esc((c.author||'F').slice(0,1).toUpperCase())}</div><div class="comment-bubble"><b>${esc(c.author||'Family member')}</b><p>${esc(c.text)}</p><small>${esc(c.date||'')}</small>${(c.replies||[]).map(r=>`<div class="comment-reply"><b>${esc(r.author||'Family member')}</b> ${esc(r.text)} <small>${esc(r.date||'')}</small></div>`).join('')}<button class="text-action" onclick="replyToEventComment(${eid},${i})">Reply</button></div></div>`).join('')||'<div class="empty">No comments yet. Start the conversation about this event.</div>'}</div><div class="event-comment-composer"><textarea id="eventCommentText" placeholder="Write a comment..."></textarea><button class="btn primary" onclick="addEventComment(${eid})">Comment</button></div><div class="form-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn small" onclick="closeModal();eventModal('${e.date}')">Edit / add event</button></div>`)}
function addEventComment(eid){const e=db.events.find(x=>String(x.id)===String(eid));const box=$('#eventCommentText');if(!e||!box||!box.value.trim())return;e.comments=e.comments||[];e.comments.push({author:db.settings.name||'Family member',text:box.value.trim(),date:new Date().toLocaleDateString(),replies:[]});save();eventDiscussion(eid)}
function replyToEventComment(eid,index){const e=db.events.find(x=>String(x.id)===String(eid));if(!e)return;const t=prompt('Write a reply');if(!t)return;e.comments[index].replies=e.comments[index].replies||[];e.comments[index].replies.push({author:db.settings.name||'Family member',text:t,date:new Date().toLocaleDateString()});save();eventDiscussion(eid)}
function notificationSettingsModal(){const n=db.settings.notifications||{};openModal('Calendar notification settings',`<p class="hint">Choose which family updates you want reminders for. These preferences are saved on this device.</p><div class="notification-options"><label><input type="checkbox" id="nBirthdays" ${n.birthdays!==false?'checked':''}> Birthday reminders</label><label><input type="checkbox" id="nEvents" ${n.events!==false?'checked':''}> Upcoming calendar events</label><label><input type="checkbox" id="nPosts" ${n.posts!==false?'checked':''}> New family discussion posts</label><label><input type="checkbox" id="nComments" ${n.comments!==false?'checked':''}> Comments and replies</label></div><div class="field"><label>Remind me</label><select id="nTiming"><option value="sameDay" ${n.timing==='sameDay'?'selected':''}>On the day</option><option value="1day" ${!n.timing||n.timing==='1day'?'selected':''}>1 day before</option><option value="3days" ${n.timing==='3days'?'selected':''}>3 days before</option><option value="1week" ${n.timing==='1week'?'selected':''}>1 week before</option></select></div><div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNotificationSettings()">Save settings</button></div><p class="hint">Actual push, email, or text delivery will require a shared backend and notification service.</p>`)}
function saveNotificationSettings(){db.settings.notifications={birthdays:$('#nBirthdays').checked,events:$('#nEvents').checked,posts:$('#nPosts').checked,comments:$('#nComments').checked,timing:$('#nTiming').value};save();closeModal()}
function familyPage(){
 const branches=['Rodney Gene Reese','Terre Gay Reese','Max Alan Reese','James Lee Reese','Ken Ray Reese'];
 const labels={'Rodney Gene Reese':'Rodney Gene Reese & Diana Lynn Lyall Reese','Terre Gay Reese':'Terre Gay Reese & Mark Lee McDonald','Max Alan Reese':'Max Alan Reese & Kimberly Kay Waldrop Reese','James Lee Reese':'James Lee Reese & Margaret Lynn Lobmeyer Reese','Ken Ray Reese':'Ken Ray Reese & Lynn Ellen Garde Reese'};
 const branchCards=branches.map((branch,index)=>{
  const people=db.people.filter(p=>p.branch===branch);
  return `<details class="family-branch-tree"><summary><span class="branch-number">${index+1}</span><span class="branch-summary-copy"><b>${esc(labels[branch])}</b><small>${people.length} family members · ${people.filter(p=>p.birthday).length} birthdays</small></span><span class="branch-chevron">⌄</span></summary><div class="family-branch-grid">${people.map(p=>`<button class="family-node" onclick="personDetail(${p.id})"><span class="family-node-avatar">${p.photo?`<img src="${p.photo}">`:esc(p.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span class="family-node-copy"><b>${esc(p.name)}</b><small>${esc(p.relation||'Family member')}</small><small class="family-bday">${p.birthday?'🎂 '+new Date(p.birthday+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}):'Birthday not listed'}</small></span></button>`).join('')||'<p class="hint">No members in this branch yet.</p>'}</div></details>`;
 }).join('');
 const founders=db.people.filter(p=>p.branch==='Founders');
 const unassigned=db.people.filter(p=>!p.branch||(!branches.includes(p.branch)&&p.branch!=='Founders'));
 const extra=unassigned.length?`<details class="family-branch-tree"><summary><span class="branch-number">+</span><span class="branch-summary-copy"><b>Other / unassigned family members</b><small>${unassigned.length} family members</small></span><span class="branch-chevron">⌄</span></summary><div class="family-branch-grid">${unassigned.map(p=>`<button class="family-node" onclick="personDetail(${p.id})"><span class="family-node-avatar">${p.photo?`<img src="${p.photo}">`:esc(p.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span class="family-node-copy"><b>${esc(p.name)}</b><small>${esc(p.relation||'Family member')}</small><small class="family-bday">${p.birthday?'🎂 '+new Date(p.birthday+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}):'Birthday not listed'}</small></span></button>`).join('')}</div></details>`:'';
 return head('ROOTS & BRANCHES','Family tree & directory','A tree-style view of the Reese family. Open a branch to explore its members; select any person to view their profile.',btn('+ Add family member','personModal()','primary'))+
 `<div class="tree-hero" style="${localStorage.getItem('reeseTreeHeader')?`background-image:linear-gradient(90deg,#242a24bb,#242a2433),url(${localStorage.getItem('reeseTreeHeader')})`:''}"><div><div class="eyebrow" style="color:#e4d1a9">THE REESE FAMILY TREE</div><h2>Darrell & Ruth’s Family</h2><p>Five branches. Generations of family.</p></div><label class="btn small">Upload header photo<input type="file" accept="image/*" onchange="uploadTreeHeader(event)"></label></div>
 <div class="notice">Birthdays are linked to each person's profile and calendar. Update a birthday in the profile and the calendar updates automatically. Missing dates are left blank rather than guessed.</div>
 <div class="family-tree-root"><div class="root-tree-icon">♧</div><div class="eyebrow">THE ROOTS OF REESE DAIRY</div><h3>Darrell Dean Reese & Ruth Jeanette Webster Reese</h3><p>Married July 11, 1952</p><div class="founder-dates"><span>Darrell · July 11, 1932</span><span>Ruth · August 5, 1933</span><span>Anniversary · July 11</span></div><div class="root-members">${founders.map(p=>`<button class="root-person" onclick="personDetail(${p.id})">${esc(p.name)} · ${p.birthday?new Date(p.birthday+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'Birthday not listed'}</button>`).join('')}</div></div>
 <div class="tree-trunk" aria-hidden="true"></div><div class="tree-controls"><div><b>${db.people.length} family members</b><small>${db.people.filter(p=>p.birthday).length} birthdays connected to the calendar</small></div><div class="toolbar"><button class="btn small" onclick="setFamilyBranches(true)">Expand all</button><button class="btn small" onclick="setFamilyBranches(false)">Collapse all</button></div></div>
 <div class="family-tree-branches">${branchCards}${extra}</div>`;
}
function setFamilyBranches(expanded){document.querySelectorAll('.family-branch-tree').forEach(x=>x.open=expanded);}

function personModal(){openModal('Add a family member',`<form onsubmit="savePerson(event)">${field('Full name','name')}${field('Relationship to family','relation')}${field('Birthday','birthday','date')}<div class="field"><label>Place in the family tree</label><select name="branch" required><option value="">Choose a family branch</option><option value="Founders">Darrell & Ruth · Founders</option><option value="Rodney Gene Reese">Rodney & Diana · Rodney branch</option><option value="Terre Gay Reese">Terre & Mark · Terre branch</option><option value="Max Alan Reese">Max & Kimberly · Max branch</option><option value="James Lee Reese">James & Margaret · James branch</option><option value="Ken Ray Reese">Ken & Lynn · Ken branch</option><option value="Other">Other / unassigned</option></select></div><div class="field"><label>Generation / family notes</label><input name="generation" placeholder="e.g. Grandchild, spouse, great-grandchild"></div><div class="field"><label>Short bio</label><textarea name="bio"></textarea></div>${field('Phone number','phone','tel')}<div class="field"><label>Address</label><textarea name="address"></textarea></div><label><input type="checkbox" name="private" checked> Keep contact details private (approval required)</label><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add to family tree</button></div></form>`)}
function savePerson(e){e.preventDefault();db.people.push({id:id(),name:val('name'),relation:val('relation'),birthday:val('birthday'),branch:val('branch'),generation:val('generation'),bio:val('bio'),phone:val('phone'),address:val('address'),private:checked('private'),photo:''});save();closeModal();render()}
function personDetail(pid){let p=db.people.find(x=>x.id===pid);if(!p)return;activePerson=pid;let mem=db.memories.filter(m=>(m.person==pid||(m.personIds||[]).includes(pid))&&(m.visibility==='public'||m.owner==='you'));openModal(p.name,`<div style="display:flex;gap:15px;align-items:center;margin:12px 0">${p.photo?`<img src="${p.photo}" style="width:90px;height:90px;border-radius:50%;object-fit:cover">`:`<div class="placeholder" style="width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#eee9dc;font-size:26px">${esc(p.name[0])}</div>`}<div><b>${esc(p.relation)}</b><p class="hint">${esc(p.generation||'')}</p><p class="hint">Birthday: ${p.birthday?new Date(p.birthday+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}):'Not added'}</p><button class="btn small" onclick="editPersonBirthday(${pid})">Edit birthday</button></div></div><div class="field"><label>Family photo</label><input type="file" accept="image/*" onchange="personPhoto(event,${pid})"></div><p style="font-size:12px">${esc(p.bio||'No bio added yet.')}</p><div class="notice">${p.private?'Contact details are private. A request/approval workflow will be enabled when the app has member accounts.':'Contact details are visible to family members.'}</div>${p.private?'<button class="btn" onclick="requestContactAccess()">Request contact access</button>':`<p class="hint">${esc(p.phone)}<br>${esc(p.address)}</p>`}<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><b>Memories</b>${mem.map(m=>`<div class="memory"><b>${esc(m.title)}</b><p>${esc(m.text)}</p></div>`).join('')||'<p class="hint">No shared memories linked to this person yet.</p>'}<div class="form-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();memoryModal(${pid})">Add a memory</button></div><details class="quiet-delete"><summary>Remove family member</summary><p>Removes this person from the tree and birthday calendar. Existing memories are retained.</p><button class="btn danger small" onclick="deleteFamilyMember(${pid})">Confirm remove</button></details>`)}
function requestContactAccess(){alert('Contact access request saved in this demo. A live app will notify the member for approval.')}
function deleteFamilyMember(pid){const p=db.people.find(x=>x.id===pid);if(!p)return;if(!confirm('Remove '+p.name+' from the family tree? This cannot be undone.'))return;db.people=db.people.filter(x=>x.id!==pid);save();closeModal();render()}
function personPhoto(e,pid){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.people.find(p=>p.id===pid).photo=r.result;save();personDetail(pid)};r.readAsDataURL(f)}
function uploadTreeHeader(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.querySelector('.tree-hero').style.backgroundImage=`linear-gradient(90deg,#242a24bb,#242a2433),url(${r.result})`;localStorage.setItem('reeseTreeHeader',r.result)};r.readAsDataURL(f)}
let recipeFilter='All';
function filterRecipes(category){recipeFilter=category;render()}
function cookbookPage(){const categories=['All','Breakfast','Appetizer','Dinner','Lunch','Side Dish','Dessert','Drinks','Bread','Holiday','Sauces & Condiments','Snacks','Other'];const recipes=db.recipes.filter(r=>recipeFilter==='All'||(r.category||'Other')===recipeFilter);return head('PASSED DOWN, NEVER LOST','Family cookbook','Recipes, kitchen notes, and the dishes that bring everyone back to the table.',btn('+ Add a recipe','recipeModal()','primary'))+`<div class="recipe-filters">${categories.map(c=>`<button class="btn small ${recipeFilter===c?'primary':''}" onclick="filterRecipes('${c}')">${c}</button>`).join('')}</div><div class="card">${recipes.map(r=>`<div class="recipe"><div style="display:flex;justify-content:space-between;gap:10px"><h4>${esc(r.title)}</h4><button class="btn small" onclick="deleteItem('recipes',${r.id})">Remove</button></div><span class="tag">${esc(r.category||'Other')}</span><p><b>Ingredients</b><br>${esc(r.ingredients)}</p><p><b>Instructions</b><br>${esc(r.instructions)}</p><small class="hint">Shared by ${esc(r.by||'Family')}</small></div>`).join('')||'<div class="empty">No recipes in this category yet.</div>'}</div>`}
function recipeModal(){openModal('Add a family recipe',`<form onsubmit="saveRecipe(event)">${field('Recipe name','title')}<div class="field"><label>Category</label><select name="category"><option>Breakfast</option><option>Appetizer</option><option>Dinner</option><option>Lunch</option><option>Side Dish</option><option>Dessert</option><option>Drinks</option><option>Bread</option><option>Holiday</option><option>Sauces & Condiments</option><option>Snacks</option><option>Other</option></select></div><div class="field"><label>Ingredients</label><textarea name="ingredients" placeholder="One ingredient per line"></textarea></div><div class="field"><label>Instructions</label><textarea name="instructions" placeholder="How does the family make it?"></textarea></div>${field('Submitted by','by', 'text',db.settings.name)}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save recipe</button></div></form>`)}
function saveRecipe(e){e.preventDefault();db.recipes.push({id:id(),title:val('title'),category:val('category'),ingredients:val('ingredients'),instructions:val('instructions'),by:val('by')});save();closeModal();render()}
function photosPage(){return head('MOMENTS THAT MATTER','Photo albums','Collect the snapshots, celebrations, and everyday moments that tell our story.',btn('+ Create album','albumModal()','primary'))+`<div class="album-grid">${db.albums.map(a=>`<div class="album" onclick="openAlbum(${a.id})"><div class="album-cover">${a.photos[0]?`<img src="${a.photos[0].src}">`:'✧'}</div><div class="album-info"><b>${esc(a.title)}</b><small>${a.photos.length} photos · ${esc(a.description||'Family album')}</small></div></div>`).join('')}</div>`}
function albumModal(){openModal('Create a photo album',`<form onsubmit="saveAlbum(event)">${field('Album title','title')}${field('Description','description')}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create album</button></div></form>`)}function saveAlbum(e){e.preventDefault();db.albums.push({id:id(),title:val('title'),description:val('description'),photos:[]});save();closeModal();render()}
function openAlbum(aid){activeAlbum=aid;let a=db.albums.find(x=>x.id===aid);openModal(a.title,`<div class="field"><label>Add photos</label><input type="file" accept="image/*" multiple onchange="addPhotos(event,${aid})"></div><div class="photo-grid">${a.photos.map((p,i)=>`<div class="photo"><img src="${p.src}"><div class="photo-foot">${esc(p.caption||'Family moment')}<br><button onclick="reactPhoto(${aid},${i},'♡')">♡ ${p.likes||0}</button> <button onclick="commentPhoto(${aid},${i})">Comment</button></div></div>`).join('')}</div><div class="form-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function addPhotos(e,aid){let files=[...e.target.files],a=db.albums.find(x=>x.id===aid);files.forEach(f=>{let r=new FileReader();r.onload=()=>{a.photos.push({src:r.result,caption:f.name,likes:0,comments:[]});save();openAlbum(aid)};r.readAsDataURL(f)})}function reactPhoto(aid,i){db.albums.find(a=>a.id===aid).photos[i].likes++;save();openAlbum(aid)}function commentPhoto(aid,i){let c=prompt('Add a kind comment');if(c){db.albums.find(a=>a.id===aid).photos[i].comments.push(c);save();alert('Comment added in this demo.')}}
function historyPage(){return head('THE STORY CONTINUES','Our history','An evolving timeline of the people, places, and moments that shaped the Reese family.',btn('+ Add to timeline','timelineModal()','primary'))+`<div class="card"><div class="eyebrow">A LIVING FAMILY RECORD</div><div class="timeline">${[...db.timeline].sort((a,b)=>String(b.year).localeCompare(String(a.year))).map(t=>`<div class="timeline-item"><div class="year">${esc(t.year)}</div><span class="tag">${esc(t.type||'Family moment')}</span><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p>${(t.media||[]).map(m=>m.kind==='video'?`<video controls playsinline style="max-width:100%;width:360px;border-radius:8px"><source src="${m.src}" type="${m.mime}"></video>`:`<img src="${m.src}" alt="${esc(m.name||'History photo')}" style="max-width:240px;max-height:220px;object-fit:cover;border-radius:8px">`).join('')}${t.photo?`<img src="${t.photo}" style="max-width:240px;border-radius:8px">`:''}</div>`).join('')}</div></div>`}
function timelineModal(){openModal('Add a moment to history',`<form onsubmit="saveTimeline(event)">${field('Year or date','year','text','2026')}${field('Title','title')}<div class="field"><label>Type of moment</label><select name="type"><option>Family milestone</option><option>Wedding</option><option>Birth</option><option>Birthday</option><option>Reunion</option><option>Farm history</option><option>Holiday</option><option>Memorial</option><option>Achievement</option><option>Everyday memory</option><option>Other</option></select></div><div class="field"><label>Story / description</label><textarea name="description"></textarea></div><div class="field"><label>Add photos and/or videos</label><input type="file" name="timelineMedia" accept="image/*,video/*" multiple><small class="hint">You can select several photos and videos.</small></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add to history</button></div></form>`)}
async function saveTimeline(e){e.preventDefault();const files=[...e.target.elements.timelineMedia.files];const media=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({kind:file.type.startsWith('video/')?'video':'image',mime:file.type,src:reader.result,name:file.name});reader.onerror=reject;reader.readAsDataURL(file)})));db.timeline.push({id:id(),year:val('year'),title:val('title'),type:val('type'),description:val('description'),media});save();closeModal();render()}
function memoriesPage(){return head('STORIES WE KEEP','Memory wall','Share a story, honor someone, and connect memories to one or more people in your family tree.',btn('+ Share a memory','memoryModal()','primary'))+`<div class="notice">A memory can mention several family members. It will appear on each selected person's profile. Choose public or private visibility.</div>${db.memories.map(m=>{const ids=m.personIds||((m.person!==null&&m.person!==undefined)?[m.person]:[]);const names=ids.map(pid=>db.people.find(p=>p.id==pid)?.name).filter(Boolean);return `<div class="card" style="margin-bottom:12px"><div class="post-meta"><span>${names.length?'About '+names.map(esc).join(', '):'Family memory'}</span><span>${esc(m.visibility)} · ${esc(m.owner)}</span></div><div class="memory"><b>${esc(m.title)}</b><p>${esc(m.text)}</p></div></div>`}).join('')||'<div class="card empty">The memory wall is waiting for its first story.</div>'}`}
function memoryModal(pid=''){openModal('Share a family memory',`<form onsubmit="saveMemory(event)">${field('Memory title','title')}<div class="field"><label>The story</label><textarea name="text" placeholder="Tell us what you remember..."></textarea></div><div class="field"><label>People in this memory · Select everyone who belongs in the story</label><div class="person-check-list">${db.people.map(p=>`<label><input type="checkbox" name="personIds" value="${p.id}" ${String(pid)===String(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div><div class="field"><label>Who can see this?</label><select name="visibility"><option value="public">Public to family</option><option value="private">Private to me</option></select></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Share memory</button></div></form>`)}
function saveMemory(e){e.preventDefault();const personIds=[...e.target.querySelectorAll('input[name="personIds"]:checked')].map(x=>Number(x.value));db.memories.push({id:id(),title:val('title'),text:val('text'),personIds,person:personIds[0]||null,visibility:val('visibility'),owner:'you'});save();closeModal();render()}
function archiveModal(){openModal('Add to the family archives',`<form onsubmit="saveArchiveEntry(event)">${field('Title','title')}<div class="field"><label>Entry type</label><select name="type"><option>Audio recording</option><option>Video</option><option>Photo collection</option><option>Written story</option><option>Document</option><option>Mixed media</option></select></div><div class="field"><label>Story, transcript, or description</label><textarea name="text" placeholder="Add context, names, dates, or the story behind these files..."></textarea></div><div class="field"><label>Attach audio, video, and/or photos</label><input type="file" name="archiveMedia" accept="audio/*,video/*,image/*" multiple><small class="hint">Attach several files, including a mix of audio, video, and photos.</small></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save to archives</button></div></form>`)}
async function saveArchiveEntry(e){e.preventDefault();const files=[...e.target.elements.archiveMedia.files];const media=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({kind:file.type.startsWith('audio/')?'audio':file.type.startsWith('video/')?'video':'image',mime:file.type,src:reader.result,name:file.name});reader.onerror=reject;reader.readAsDataURL(file)})));db.archive.push({id:id(),title:val('title'),type:val('type'),text:val('text'),media,created:new Date().toISOString()});save();closeModal();render()}
function deleteArchiveEntry(aid){if(!confirm('Remove this archive entry?'))return;db.archive=db.archive.filter(a=>a.id!==aid);save();render()}
function archivesPage(){let audio=['D&J Reese - A Trip to the Farm','Darrel Reese','Jeanette Reese: On Teaching Sunday School','D&J Reese: Reese Dairy','Jeanette Reese: Deer Creek Life','Jeanette Reese: Mercantile','Darrell Reese: Gma’s Parents and Mercantile Work','Darrell Reese: Grain Snacks','Darrell Reese: Grange Hall, Nardin, OK','Darrell Reese: Jack Rabbit Hunt and Badgers','Darrell Reese: Nardin Bandstand','Darrell Reese: Nardin Bank and Bank Robbery','Darrell Reese: Nardin Furniture Store','Darrell Reese: Norwegian Rats and Rat Terriers','Darrell Reese: School Days','D&J Reese: August and Sara’s House','D&J Reese: Being Parents','D&J Reese: Clark Boys','D&J Reese: Exploring','D&J Reese: Frozen Ponds','D&J Reese: Gma on Unicycle','D&J Reese: Little Joanna','D&J Reese: Neighbors in Country','D&J Reese: Pop and Ice Delivery','D&J Reese: School in Deer Creek','D&J Reese: Tolle Farming','D&J Reese: Tolles and Coca Cola','Darrell Reese: NWA Trail Talk 1','Darrell Reese: NWA Trail Talk 2'];let interviews=['Frank Reese · 1:00:05','Herbert & Opal Reese · 46:53','Albert & Bertha Reese · 1:09:29','Mabel Reese · 55:11','Albert Reese','Harold Reese'];return head('THE FAMILY ARCHIVE','Where our story lives','A doorway to the original recordings, albums, interviews, and family videos.',btn('+ Add to archives','archiveModal()','primary'))+`<div class="notice"><a href="https://www.jojreese.com/reese" target="_blank" rel="noopener">Visit original Reese archive ↗</a></div><div class="card" style="margin-bottom:16px"><div class="section-title"><h3>Added by the family</h3><span class="tag">${(db.archive||[]).length} entries</span></div>${(db.archive||[]).map(a=>`<div class="archive-entry"><div class="post-meta"><b>${esc(a.title)}</b><span>${esc(a.type)}</span></div><p>${esc(a.text||'')}</p>${(a.media||[]).map(m=>m.kind==='audio'?`<audio controls preload="metadata" style="width:100%"><source src="${m.src}" type="${m.mime}"></audio>`:m.kind==='video'?`<video controls playsinline style="width:100%;max-width:420px;border-radius:8px"><source src="${m.src}" type="${m.mime}"></video>`:`<img src="${m.src}" style="max-width:220px;max-height:200px;object-fit:cover;border-radius:8px">`).join('')}<button class="btn small" onclick="deleteArchiveEntry(${a.id})">Remove</button></div>`).join('')||'<p class="hint">No family-added archive entries yet.</p>'}</div><div class="notice">These titles are indexed from the original Reese Family Archives. The original page remains the source for playback and downloads; individual media URLs are not exposed in its public text index, so no recording links have been guessed.</div><div class="card" style="margin-bottom:16px"><div class="section-title"><h3>Family audio recordings</h3><span class="tag">${audio.length} archive entries</span></div><div class="archive-list">${audio.map(x=>`<div class="archive-item"><b>♫ ${esc(x)}</b><small>Family audio · Open original archive for playback</small></div>`).join('')}</div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Grandpa Darrell · Interview tapes</h3></div>${interviews.map(x=>`<div class="event-row"><div class="event-info"><b>${esc(x)}</b><p>Family interview recording</p></div></div>`).join('')}</div><div class="card"><h3>Albums & family films</h3><div class="event-row"><div class="event-info"><b>Grandma Jeanette</b><p>Family photo album</p></div></div><div class="event-row"><div class="event-info"><b>The Blessing · Lynn Ellen Reese</b><p>Family history</p></div></div><div class="event-row"><div class="event-info"><b>Lynn Reese Memorial Bike Tour 2024</b><p>Family video</p></div></div></div></div>`}
function discussionPage(){return head('KEEP IN TOUCH','Family discussion','A shared family thread for questions, updates, and conversations around family events.',btn('+ New poll','pollModal()','primary'))+`<div class="card"><div class="section-title"><h3>The family thread</h3><span class="hint">Kindness lives here.</span></div><div class="thread-composer"><textarea id="postText" placeholder="Write something for the family..."></textarea><div class="thread-compose-bottom"><select id="postEvent"><option value="">No calendar event attached</option>${db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<option value="${e.id}">${esc(e.title)} · ${esc(e.date)}</option>`).join('')}</select><button class="btn primary" onclick="addPost()">Post</button></div></div>${db.posts.slice().reverse().map(p=>{const linked=db.events.find(e=>String(e.id)===String(p.eventId));return `<div class="post social-post"><div class="post-meta"><b>${esc(p.displayName||p.author)}</b><span>${esc(p.date)} ${(p.owner==='you'||p.author==='you')?`<button class="btn small" onclick="deleteItem('posts',${p.id})">Delete</button>`:''}</span></div>${linked?`<button class="event-link-tag" onclick="eventDiscussion(${linked.id})">▦ ${esc(linked.title)} · ${esc(linked.date)} <span>View event discussion ↗</span></button>`:''}<p>${esc(p.text)}</p><div class="reactions">${['♡ Heartfelt','☀ Warmth','✿ Comfort','☺ Laughing'].map(r=>`<button class="reaction" onclick="reactPost(${p.id},'${r}')">${r} ${p.reactions?.[r]||''}</button>`).join('')} <button class="reaction" onclick="commentPost(${p.id})">Comment (${p.comments?.length||0})</button></div>${(p.comments||[]).map(c=>`<div class="feed-comment"><b>Family member</b><span>${esc(typeof c==='string'?c:c.text)}</span></div>`).join('')}</div>`}).join('')||'<div class="empty">The family thread is waiting for its first conversation.</div>'}</div>${db.polls.map(p=>`<div class="card" style="margin-top:14px"><div class="post-meta"><b>Family poll</b><button class="btn small" onclick="deleteItem('polls',${p.id})">Delete</button></div><h3 style="margin-top:10px">${esc(p.question)}</h3>${p.options.map((o,i)=>`<label style="display:block;padding:8px;border-bottom:1px solid var(--line);font-size:12px"><input type="radio" name="poll${p.id}" value="${i}"> ${esc(o)} <span class="hint">· ${p.votes[i]||0} votes</span></label>`).join('')}<div style="margin-top:10px">${btn('Vote',`votePoll(${p.id})`,'small')}</div></div>`).join('')}`}
function addPost(){let t=$('#postText').value.trim();if(!t)return;const eventId=$('#postEvent')?.value||'';db.posts.push({id:id(),author:'you',displayName:db.settings.name||'Family member',owner:'you',date:new Date().toLocaleDateString(),text:t,eventId:eventId||null,comments:[],reactions:{}});save();render()}
function reactPost(pid,r){let p=db.posts.find(x=>x.id===pid);p.reactions[r]=(p.reactions[r]||0)+1;save();render()}
function commentPost(pid){let t=prompt('Write a kind comment');if(t){db.posts.find(x=>x.id===pid).comments.push({text:t,author:db.settings.name||'Family member',date:new Date().toLocaleDateString()});save();render()}}
function pollModal(){openModal('Create a family poll',`<form onsubmit="savePoll(event)">${field('Question','question')}${field('Option 1','o1')}${field('Option 2','o2')}${field('Option 3 (optional)','o3')}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create poll</button></div></form>`)}function savePoll(e){e.preventDefault();let opts=[val('o1'),val('o2'),val('o3')].filter(Boolean);db.polls.push({id:id(),question:val('question'),options:opts,votes:opts.map(()=>0)});save();closeModal();render()}function votePoll(pid){let p=db.polls.find(x=>x.id===pid),v=document.querySelector(`[name="poll${pid}"]:checked`);if(v){p.votes[Number(v.value)]++;save();render()}}
function funPage(){return head('A LITTLE FAMILY FUN','Gather & play','A place for the traditions, videos, and games that make get-togethers memorable.')+`<div class="grid two"><div class="card"><h3>Dirty Santa number wheel</h3><p class="hint">Choose who's playing, then spin to assign a random number to everyone.</p><div class="field"><label>Players in the drawing</label><div style="max-height:170px;overflow:auto">${db.people.map(p=>`<label style="display:block;padding:5px;font-size:12px"><input type="checkbox" class="playerCheck" value="${p.id}" checked> ${esc(p.name)}</label>`).join('')}</div></div><div class="wheel-wrap"><div style="position:relative"><div class="wheel-pointer"></div><div class="wheel" id="wheel"></div></div><div><div id="spinResult" class="hint">Ready when you are. The wheel will assign a unique number to each player.</div><button class="btn primary" style="margin-top:14px" onclick="spinWheel()">Spin the wheel</button><div id="assignments" style="margin-top:15px"></div></div></div></div><div class="card"><h3>Watch & share</h3><p class="hint">Share a family video, YouTube link, or something worth watching together.</p><div class="field"><label>YouTube or video link</label><input id="videoUrl" placeholder="https://www.youtube.com/watch?v=..."></div><button class="btn primary" onclick="addVideo()">Add video</button><div id="videos" style="margin-top:15px">${(db.videos||[]).map(v=>`<div class="event-row"><div class="event-info"><b>${esc(v.title)}</b><p><a href="${esc(v.url)}" target="_blank">Open video ↗</a></p></div></div>`).join('')}</div></div></div>`}
function spinWheel(){let players=[...document.querySelectorAll('.playerCheck:checked')].map(x=>db.people.find(p=>p.id==x.value)).filter(Boolean);if(!players.length){alert('Select at least one player.');return}let nums=players.map((_,i)=>i+1).sort(()=>Math.random()-.5);let assignments=players.map((p,i)=>({name:p.name,n:nums[i]})).sort((a,b)=>a.n-b.n);spinDeg+=1440+Math.random()*720;$('#wheel').style.transform=`rotate(${spinDeg}deg)`;$('#spinResult').textContent='Spinning...';$('#assignments').innerHTML='';setTimeout(()=>{$('#spinResult').textContent='The drawing is complete!';$('#assignments').innerHTML=assignments.map(a=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px"><span>${esc(a.name)}</span><b>#${a.n}</b></div>`).join('')},4100)}function addVideo(){let u=$('#videoUrl').value.trim();if(!u)return;try{new URL(u)}catch(e){alert('Enter a valid link.');return}db.videos=db.videos||[];db.videos.push({url:u,title:u.includes('youtube')?'YouTube family video':'Shared family link'});save();render()}
function settingsPage(){return head('YOUR FAMILY HUB','Notifications & settings','Choose how you want to hear from the family.')+`<div class="card" style="max-width:650px"><h3>Notification preferences</h3><p class="hint">These are your preferences for a future connected version of Reese Dairy.</p>${field('Your display name','displayName','text',db.settings.name)}<div class="field"><label>Notification channels</label><label style="display:block;padding:7px 0"><input type="checkbox" id="emailOpt" ${db.settings.email?'checked':''}> Email notifications</label><label style="display:block;padding:7px 0"><input type="checkbox" id="smsOpt" ${db.settings.sms?'checked':''}> Text message notifications</label></div><div class="field"><label>Text message notification tier</label><select id="tier"><option value="big" ${db.settings.tier==='big'?'selected':''}>Big events only — major family gatherings & important announcements</option><option value="all" ${db.settings.tier==='all'?'selected':''}>All family updates — events, announcements & reminders</option><option value="urgent" ${db.settings.tier==='urgent'?'selected':''}>Essential only — urgent family notices</option></select></div><label style="display:block;padding:8px 0"><input type="checkbox" id="mute" ${db.settings.muted?'checked':''}> Mute family discussion notifications</label><button class="btn primary" onclick="saveSettings()">Save preferences</button><div class="notice">Prototype note: saving preferences here stores them in this browser only. Actual SMS/email delivery requires a secure backend, verified contact details, consent tracking, and an email/SMS provider. Text opt-in must include clear consent and opt-out handling.</div></div><div class="card" style="max-width:650px;margin-top:16px"><h3>About this prototype</h3><p class="hint">Your entries are stored in this browser using local storage. They are not yet shared with other family members or protected by user accounts. Do not enter sensitive private information until authentication and server-side privacy controls are added.</p><button class="btn" onclick="if(confirm('Reset this browser demo to the original sample data?')){localStorage.removeItem('reeseDairyData');location.reload()}">Reset demo data</button></div>`}
function saveSettings(){db.settings={...db.settings,name:val('displayName'),email:$('#emailOpt').checked,sms:$('#smsOpt').checked,tier:$('#tier').value,muted:$('#mute').checked};db.settings.notifications=db.settings.notifications||{birthdays:true,events:true,posts:true,comments:true,timing:'1day'};save();$('#topGreeting').textContent='Welcome, '+db.settings.name;alert('Preferences saved on this device.');}
function deleteItem(key,pid){if(!confirm('Remove this item?'))return;db[key]=db[key].filter(x=>x.id!==pid);save();render()}
$('#topGreeting').textContent='Welcome, '+db.settings.name;let treeBg=localStorage.getItem('reeseTreeHeader');render();
</script></body></html>
